# Flyway configuration for structural migrations (V* files).
# Usage example:
#   flyway -configFiles=flyway.conf info
#   flyway -configFiles=flyway.conf migrate

flyway.url=jdbc:postgresql://127.0.0.1:54329/xero_integration
flyway.user=postgres
flyway.password=postgres

flyway.locations=filesystem:db/migrations
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

flyway.schemas=raw,ops,core,audit,config,security
flyway.defaultSchema=public
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=true
flyway.validateMigrationNaming=true
flyway.connectRetries=30
